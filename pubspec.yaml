name: kamus_investasi
description: Kamus Investasi.

publish_to: 'none'

version: 1.1.0+12

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  upgrader: ^13.7.0
  iconsax: ^0.0.8
  google_fonts: ^9.0.0
  sqflite: ^2.4.5
  intl: ^0.20.3
  fluttertoast: ^10.0.2
  path_provider: ^2.1.6
  infinite_scroll: ^1.1.1
  share_plus: ^13.3.1
  google_mobile_ads: ^9.2.0
  url_launcher: ^6.3.3
  material_ui: ^1.8.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/datasets/dictionaries.json
    - assets/images/bookmark.png
    - assets/images/history.png
    - assets/images/feedback.png
