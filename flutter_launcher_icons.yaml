# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/launcher_icon.png"

  android: "launcher_icon"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/launcher_foreground.png"
  adaptive_icon_foreground_inset: 0  # padding is already baked into the PNG
  adaptive_icon_monochrome: "assets/icon/launcher_monochrome.png"

  ios: false
